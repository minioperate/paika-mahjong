<!doctype html><meta charset="utf-8"><title>Engine checks</title><pre id="result">running</pre><script type="module">
import {makeWall,startHand,canWin,canSelfDraw,availableClaims,actionableClaims,applyAction,normalizeClaimState} from '../dist/engine.js';
const checks=[];const check=(name,ok)=>checks.push({name,ok:!!ok});
const player=(i,hand=[])=>({uid:'u'+i,name:'p'+i,hand,flowers:[],melds:[],discards:[],balance:0,passed:false});
const room=(hands)=>({id:'test',name:'test',base:30,perTai:10,rounds:1,dealer:0,dealerStreak:0,handNumber:0,turn:0,phase:'discard',wall:Array(20).fill('p9'),players:hands.map((h,i)=>player(i,h))});
const wall=makeWall();check('144 tiles',wall.length===144);check('8 flowers',wall.filter(t=>t[0]==='f').length===8);
const winning=['m1','m1','m1','m2','m2','m2','m3','m3','m3','p4','p4','p4','s5','s5','s5','z1','z1'];
check('five sets and pair wins',canWin(winning));check('incomplete hand cannot win',!canWin(winning.slice(1)));
const fresh=startHand(room([[],[],[],[]]));check('dealer has 17 tiles',fresh.players[0].hand.length===17);check('others have 16 tiles',fresh.players.slice(1).every(p=>p.hand.length===16));check('flowers replaced',fresh.players.every(p=>p.hand.every(t=>t[0]!=='f')));
let g=applyAction(room([['m9'],[],[],[]]),0,{type:'discard',tile:'m9'});check('no claim draws automatically',g.phase==='discard'&&g.turn===1&&g.players[1].hand.length===1&&g.wall.length===19);let rejected=false;try{applyAction(g,1,{type:'pass'})}catch{rejected=true}check('cannot pass without claim',rejected);
g=applyAction(room([['m9'],[],['m9','m9'],[]]),0,{type:'discard',tile:'m9'});check('only pong player asked',g.phase==='claim'&&g.players[1].passed&&!g.players[2].passed&&g.players[3].passed);g=applyAction(g,2,{type:'pass'});check('pong pass draws automatically',g.phase==='discard'&&g.turn===1&&g.players[1].hand.length===1);
g=applyAction(room([['m2'],['m1','m3'],['m1','m3'],[]]),0,{type:'discard',tile:'m2'});check('only next seat can chow',availableClaims(g,1).some(c=>c.type==='chow')&&!availableClaims(g,2).some(c=>c.type==='chow'));rejected=false;try{applyAction(g,2,{type:'chow',tiles:['m1','m3']})}catch{rejected=true}check('non-next seat chow rejected',rejected);
const waiting=winning.slice(0,-1);g=applyAction(room([['z1'],waiting,[],[]]),0,{type:'discard',tile:'z1'});check('win offered before water',availableClaims(g,1).some(c=>c.type==='win'));g=applyAction(g,1,{type:'pass'});check('passing win starts water',g.players[1].water&&g.players[1].waterWaits.includes('z1'));let blocked={...g,phase:'discard',turn:1,players:g.players.map((p,i)=>i===1?{...p,hand:[...waiting,'z1']}:p)};check('water blocks self draw',!canSelfDraw(blocked,1));rejected=false;try{applyAction(blocked,1,{type:'win'})}catch{rejected=true}check('water self draw rejected by engine',rejected);
const claimGame=applyAction(room([['z1'],waiting,[],[]]),0,{type:'discard',tile:'z1'}),claimed=applyAction(claimGame,1,{type:'win'});check('claim win settles from button action',claimed.phase==='result'&&claimed.winner.seat===1&&claimed.players.reduce((sum,p)=>sum+p.balance,0)===0);
let doubleWin=applyAction(room([['z1'],waiting,waiting,[]]),0,{type:'discard',tile:'z1'});check('nearest winning seat can act',actionableClaims(doubleWin,1).some(c=>c.type==='win'));check('later winning seat waits',!actionableClaims(doubleWin,2).some(c=>c.type==='win'));doubleWin=applyAction(doubleWin,1,{type:'pass'});check('later winning seat can act after pass',actionableClaims(doubleWin,2).some(c=>c.type==='win'));doubleWin=applyAction(doubleWin,2,{type:'win'});check('later winning seat settles',doubleWin.phase==='result'&&doubleWin.winner.seat===2);
const selfGame={...room([winning,[],[],[]]),turn:0},selfWon=applyAction(selfGame,0,{type:'win'});check('self draw settles from button action',selfWon.phase==='result'&&selfWon.winner.selfDraw&&selfWon.players.reduce((sum,p)=>sum+p.balance,0)===0);
let kept=applyAction(blocked,1,{type:'discard',tile:'z1'});check('discarding waited tile keeps water',kept.players[1].water);blocked.players[1].hand=[...waiting,'p9'];let cleared=applyAction(blocked,1,{type:'discard',tile:'p9'});check('discarding other tile clears water',!cleared.players[1].water);
const legacy={...g,phase:'claim',lastDiscard:{seat:2,tile:'z1'},players:g.players.map((p,i)=>({...p,passed:i===1?false:p.passed}))};check('water blocks later discarded win',!availableClaims(legacy,1).some(c=>c.type==='win'));check('old claim auto normalizes',normalizeClaimState(legacy).players[1].passed);
const oldDraw={...room([[],[],[],[]]),phase:'draw',turn:2};check('existing draw state auto resolves once',normalizeClaimState(oldDraw).phase==='discard'&&normalizeClaimState(oldDraw).players[2].hand.length===1);
const failed=checks.filter(x=>!x.ok);document.querySelector('#result').textContent=JSON.stringify({passed:checks.length-failed.length,failed},null,2);
</script>
